params:
  seed: ${...seed}

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    double_critic: False # 二つのcriticのmin(v1,v2)を取る

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True

    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: ${if:${...checkpoint},True,False} # flag which sets whether to load the checkpoint
  load_path: ${...checkpoint} # path to the checkpoint to load

  config:
    name: ${resolve_default:AllegroHand,${....experiment}}
    full_experiment_name: ${.name}
    env_name: rlgpu
    multi_gpu: ${....multi_gpu}
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True

    # SAPG2を有効にする
    sapg2: True
    vanilla_sapg: False # SAPGと同じデータだけ使う設定。
    lambda_awac : 0.1 # AWAC用のlambda
    lambda_ppo: 0.1 # KLPPO用のlambda
    awac_max: 100
    awac_alpha: 1 # フォロワーオフライン学習の勾配スケール
    awac_beta: 0 # フォロワーオンライン学習の勾配スケール
    awac_gamma: 1 # PPOの勾配スケール(リーダーのオンライン・オフライン学習)
    enable_w: False # クリティックやentropy, boundry損失を、使ったデータの数で生息化する。
    save_batch: True # モデルと一緒にbatchを保存する。
    off_policy_ceb: True # オフポリシーデータをcritic, bound, entropy lossの計算に使う
    double_critic: ${..network.double_critic} # 二つのcriticのmin(v1,v2)を取る
    scheduler_kl_data: no_awac # ["no_awac","all"] AdaptiveSchedulerのためのKL計算にAWACのデータを使うかどうか。
    reduce_awac: False # AWACのデータをaugした後に削除する。(デバッグ用)

    # 敵対的報酬の設定
    use_ad_reward: True
    ad_reward_type: "sa" # 'sa', 's', 'a'
    discriminator_config: 
      units: [1024, 1024, 512, 512]
      activation: elu
    ad_reward_coef: 0

    num_actors: ${....task.env.numEnvs}
    reward_shaper:
      scale_value: 0.01
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 5e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    score_to_win: 100000
    max_epochs: 104000 #${resolve_default:500000,${....max_iterations}}
    save_best_after: 500
    save_frequency: 5200 #3000
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 8
    minibatch_size: 32768
    mini_epochs: 5
    critic_coef: 4
    clip_value: True
    seq_len: 4
    bounds_loss_coef: 0.0001

    good_reset_boundary: ${if:${....task.env.goodResetBoundary},${....task.env.goodResetBoundary},0}
    use_others_experience: 'none' # 'none', 'all', 'lead_foll'
    off_policy_ratio: 1.0

    expl_type: 'none' # 'none', 'mixed_expl', 'mixed_expl_disjoint'
    expl_reward_coef_embd_size: 16
    expl_reward_coef_scale: 1.0
    expl_reward_type: rnd
    expl_coef_block_size: 4096

    player:
      #render: True
      deterministic: True
      games_num: 100000
      print_stats: True